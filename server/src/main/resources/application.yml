server:
  port: ${PLIS_SERVER_PORT:8080}
  error:
    include-message: never

spring:
  datasource:
    url: ${PLIS_DATABASE_URL:jdbc:h2:file:./data/plis;AUTO_SERVER=TRUE}
    username: ${PLIS_DATABASE_USERNAME:sa}
    password: ${PLIS_DATABASE_PASSWORD:}
    driver-class-name: ${PLIS_DATABASE_DRIVER:org.h2.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: ${PLIS_H2_CONSOLE_ENABLED:false}

plis:
  security:
    jwt-secret: ${PLIS_JWT_SECRET:}
    token-lifetime: ${PLIS_TOKEN_LIFETIME:PT8H}
logging:
  level:
    org.springframework.security: INFO
